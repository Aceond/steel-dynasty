<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101418">
  <title>钢铁纪元 · 工业增量游戏</title>
  <style>
    :root {
      --bg: #0c1013;
      --panel: #14191e;
      --panel-2: #191f25;
      --panel-3: #20272e;
      --line: #2a3239;
      --line-soft: #222a30;
      --text: #edf1f2;
      --muted: #8d9aa3;
      --faint: #5f6b73;
      --accent: #f0a13a;
      --accent-soft: rgba(240, 161, 58, .12);
      --green: #55c7a0;
      --green-soft: rgba(85, 199, 160, .11);
      --blue: #67a9d8;
      --red: #e47768;
      --purple: #a995d5;
      --radius: 12px;
      --shadow: 0 16px 45px rgba(0,0,0,.18);
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 80% -10%, rgba(240,161,58,.06), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    button { font: inherit; }
    button, [data-action] { -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .hidden { display: none !important; }
    .muted { color: var(--muted); }
    .accent { color: var(--accent); }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .mono { font-variant-numeric: tabular-nums; font-family: "SFMono-Regular", Consolas, monospace; }
    .icon { width: 18px; height: 18px; display: inline-block; vertical-align: middle; flex: 0 0 auto; }

    .topbar {
      height: 74px;
      display: flex;
      align-items: center;
      gap: 22px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(12,16,19,.94);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 205px; cursor: pointer; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center;
      background: var(--accent); color: #17130d; clip-path: polygon(0 0, 82% 0, 100% 18%, 100% 100%, 18% 100%, 0 82%);
    }
    .brand-mark .icon { width: 23px; height: 23px; }
    .brand-title { font-size: 17px; font-weight: 800; letter-spacing: 2px; line-height: 1.1; }
    .brand-sub { color: var(--muted); font-size: 9px; letter-spacing: 3px; margin-top: 5px; }
    .resources { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .resource-chip {
      display: flex; align-items: center; gap: 9px; min-width: 130px;
      padding: 8px 12px; border: 1px solid var(--line-soft); border-radius: 9px;
      background: rgba(255,255,255,.018);
    }
    .resource-chip .icon { color: var(--muted); width: 17px; }
    .resource-value { font-weight: 750; font-size: 14px; line-height: 1.25; }
    .resource-meta { font-size: 10px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
    .resource-meta .rate { color: var(--green); margin-left: 5px; }
    .resource-chip.power .icon { color: var(--accent); }
    .resource-chip.power.warn { border-color: rgba(228,119,104,.22); background: rgba(228,119,104,.05); }
    .resource-chip.power.warn .icon, .resource-chip.power.warn .resource-value, .resource-chip.power.warn .rate { color: var(--red); }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--panel); color: var(--muted); cursor: pointer; display: grid; place-items: center;
      transition: .18s ease;
    }
    .icon-btn:hover { color: var(--text); border-color: #46515a; background: var(--panel-3); }

    .app-shell {
      max-width: 1580px; margin: 0 auto; padding: 24px 28px 50px;
      display: grid; grid-template-columns: 205px minmax(0, 1fr); gap: 24px;
    }
    .sidebar { position: sticky; top: 98px; align-self: start; }
    .site-card {
      padding: 16px; border: 1px solid var(--line); border-radius: var(--radius);
      background: linear-gradient(145deg, var(--panel-2), var(--panel)); margin-bottom: 14px;
    }
    .site-eyebrow { font-size: 10px; color: var(--accent); letter-spacing: 1.8px; font-weight: 700; }
    .site-name { font-weight: 700; font-size: 16px; margin-top: 5px; }
    .site-level { display: flex; justify-content: space-between; margin-top: 12px; font-size: 11px; color: var(--muted); }
    .xp-track { height: 4px; border-radius: 5px; background: #293138; margin-top: 7px; overflow: hidden; }
    .xp-fill { height: 100%; background: var(--accent); border-radius: inherit; }
    .nav { display: grid; gap: 5px; scrollbar-width: none; max-height: calc(100vh - 285px); overflow-y: auto; }
    .nav::-webkit-scrollbar { display: none; }
    .nav-btn {
      border: 1px solid transparent; background: transparent; color: var(--muted);
      padding: 11px 13px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 11px;
      text-align: left; transition: .18s ease; position: relative;
    }
    .nav-btn:hover { color: var(--text); background: var(--panel); }
    .nav-btn.active { color: var(--text); background: var(--accent-soft); border-color: rgba(240,161,58,.18); }
    .nav-btn.active .icon { color: var(--accent); }
    .nav-badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center; border-radius: 9px; background: var(--accent); color: #18130d; font-size: 10px; font-weight: 800; }
    .sidebar-foot { color: var(--faint); font-size: 10px; padding: 16px 12px; line-height: 1.8; }
    .status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--green); margin-right: 6px; box-shadow: 0 0 8px rgba(85,199,160,.4); }
    .content { min-width: 0; }

    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin: 2px 0 20px; }
    .page-kicker { color: var(--accent); font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 5px; }
    h1 { margin: 0; font-size: 25px; letter-spacing: -.5px; }
    .page-desc { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .head-actions { display: flex; gap: 8px; align-items: center; }
    .segmented { padding: 3px; border: 1px solid var(--line); background: var(--panel); border-radius: 9px; display: flex; }
    .segment {
      border: 0; background: transparent; color: var(--muted); border-radius: 6px;
      padding: 6px 12px; font-size: 11px; cursor: pointer;
    }
    .segment.active { color: var(--text); background: var(--panel-3); box-shadow: 0 1px 5px rgba(0,0,0,.2); }

    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
    .panel-title { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 13px; }
    .panel-title .icon { color: var(--muted); }
    .panel-tag { font-size: 10px; color: var(--muted); letter-spacing: .5px; }
    .panel-body { padding: 18px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
    .overview-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, .8fr); gap: 16px; }
    .stack { display: grid; gap: 16px; }

    .hero {
      min-height: 290px; position: relative; overflow: hidden;
      background: linear-gradient(115deg, #1b2228 0%, #151b20 55%, #20221f 100%);
    }
    .hero:before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 32px 32px; mask-image: linear-gradient(90deg, black, transparent 75%); }
    .hero-copy { position: relative; z-index: 2; padding: 30px; width: 55%; }
    .live-badge { display: inline-flex; align-items: center; gap: 7px; padding: 5px 9px; border: 1px solid rgba(85,199,160,.25); border-radius: 5px; background: rgba(85,199,160,.07); color: var(--green); font-size: 10px; letter-spacing: 1px; }
    .live-badge.warn { border-color: rgba(240,161,58,.28); background: var(--accent-soft); color: var(--accent); }
    .live-badge.warn .status-dot { background: var(--accent); box-shadow: 0 0 8px rgba(240,161,58,.4); }
    .hero h2 { font-size: 30px; line-height: 1.18; margin: 18px 0 10px; letter-spacing: -1px; }
    .hero p { color: #a3afb6; margin: 0; max-width: 350px; font-size: 12px; line-height: 1.8; }
    .hero-stats { display: flex; gap: 24px; margin-top: 24px; }
    .hero-stat strong { display: block; font-size: 19px; }
    .hero-stat span { color: var(--muted); font-size: 10px; }
    .factory-art { position: absolute; width: 58%; right: -2%; bottom: -4px; opacity: .95; }
    .factory-art .smoke { animation: smoke-rise 5.8s cubic-bezier(.22,.61,.36,1) infinite; transform-box: fill-box; transform-origin: center bottom; will-change: transform, opacity; }
    .factory-art .smoke.two { animation-duration: 7.2s; animation-delay: -3.6s; }
    .factory-art .belt { animation: belt 3s linear infinite; }
    @keyframes smoke-rise {
      0% { opacity: 0; transform: translate(0, 4px) scale(.72); }
      18% { opacity: .28; }
      58% { opacity: .2; transform: translate(-5px, -15px) scale(1.02); }
      100% { opacity: 0; transform: translate(-11px, -42px) scale(1.34); }
    }
    @keyframes belt { to { stroke-dashoffset: -28; } }
    @media (prefers-reduced-motion: reduce) {
      .factory-art .smoke, .factory-art .belt, .module-visual:before, .module-visual:after { animation: none; }
    }

    .metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line-soft); }
    .metric { background: var(--panel); padding: 17px 18px; }
    .metric-label { color: var(--muted); font-size: 10px; display: flex; align-items: center; gap: 6px; }
    .metric-value { margin-top: 7px; font-size: 18px; font-weight: 700; }
    .metric-note { margin-top: 3px; font-size: 10px; color: var(--faint); }
    .chain { display: grid; gap: 9px; }
    .chain-row { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 10px; }
    .chain-icon { width: 30px; height: 30px; display: grid; place-items: center; background: var(--panel-3); border-radius: 6px; color: var(--muted); }
    .chain-icon .icon { width: 15px; }
    .chain-name { font-size: 11px; }
    .chain-rate { color: var(--muted); font-size: 10px; margin-top: 1px; }
    .chain-value { font-size: 12px; font-weight: 700; }
    .chain-line { width: 1px; height: 9px; background: var(--line); margin-left: 15px; }
    .objective { padding: 14px; border-radius: 8px; background: var(--accent-soft); border: 1px solid rgba(240,161,58,.16); }
    .objective-top { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
    .objective-name { font-weight: 700; }
    .progress { height: 5px; background: #293137; border-radius: 4px; overflow: hidden; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .25s linear; }
    .objective .progress { margin: 10px 0 7px; }
    .objective-foot { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; }
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }

    .btn {
      border: 1px solid var(--line); border-radius: 7px; background: var(--panel-3); color: var(--text);
      padding: 9px 14px; cursor: pointer; font-weight: 650; font-size: 11px; display: inline-flex;
      align-items: center; justify-content: center; gap: 7px; transition: .16s ease; min-height: 36px;
    }
    .btn:hover:not(:disabled) { border-color: #53606a; transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #19140d; }
    .btn.primary:hover:not(:disabled) { background: #ffb34f; border-color: #ffb34f; }
    .btn.green-btn { background: var(--green); border-color: var(--green); color: #0c1914; }
    .btn.ghost { background: transparent; }
    .btn.small { padding: 6px 10px; min-height: 29px; font-size: 10px; }
    .btn:disabled { opacity: .38; cursor: not-allowed; }
    .btn.full { width: 100%; }

    .power-banner { padding: 12px 16px; border: 1px solid rgba(85,199,160,.2); background: var(--green-soft); border-radius: 9px; display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 11px; color: var(--green); }
    .power-banner.warning { color: var(--red); background: rgba(228,119,104,.08); border-color: rgba(228,119,104,.22); }
    .power-banner .icon { width: 16px; }
    .power-banner strong { margin-right: 5px; }
    .building-card { padding: 18px; position: relative; overflow: hidden; }
    .building-card.locked { opacity: .65; }
    .building-top { display: flex; align-items: flex-start; gap: 12px; }
    .building-icon { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 9px; color: var(--accent); background: var(--accent-soft); border: 1px solid rgba(240,161,58,.12); }
    .building-icon .icon { width: 22px; height: 22px; }
    .building-name { font-weight: 750; font-size: 14px; }
    .building-desc { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .count-badge { margin-left: auto; padding: 3px 8px; border-radius: 5px; background: var(--panel-3); font-size: 11px; color: var(--muted); white-space: nowrap; }
    .building-yield { display: flex; gap: 8px; margin: 16px 0 13px; }
    .yield-chip { flex: 1; padding: 9px 10px; background: rgba(255,255,255,.022); border-radius: 7px; }
    .yield-chip span { display: block; color: var(--muted); font-size: 9px; }
    .yield-chip strong { display: block; margin-top: 2px; font-size: 12px; }
    .costs { display: flex; flex-wrap: wrap; gap: 5px 10px; min-height: 26px; align-items: center; margin-bottom: 12px; }
    .cost { font-size: 10px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
    .cost .icon { width: 12px; height: 12px; }
    .cost.lack { color: var(--red); }
    .building-foot { display: flex; align-items: center; gap: 10px; }
    .building-foot .btn { flex: 1; }
    .total-rate { color: var(--muted); font-size: 10px; white-space: nowrap; }

    .inventory-strip { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 16px; }
    .inventory-item { padding: 9px 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 115px; }
    .inventory-item span { color: var(--muted); font-size: 10px; }
    .inventory-item strong { float: right; margin-left: 18px; font-size: 12px; }
    .craft-layout { display: grid; grid-template-columns: minmax(0,1fr) 315px; gap: 16px; align-items: start; }
    .recipe-card { padding: 18px; }
    .recipe-flow { display: flex; align-items: center; gap: 10px; margin: 15px 0; }
    .recipe-part { flex: 1; border: 1px solid var(--line-soft); border-radius: 7px; padding: 9px; text-align: center; font-size: 10px; color: var(--muted); }
    .recipe-part strong { display: block; color: var(--text); font-size: 12px; margin-top: 2px; }
    .recipe-arrow { color: var(--faint); }
    .recipe-meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 10px; margin-bottom: 12px; }
    .queue-panel { position: sticky; top: 98px; }
    .queue-list { display: grid; gap: 9px; }
    .queue-item { padding: 12px; border: 1px solid var(--line-soft); border-radius: 8px; background: rgba(255,255,255,.015); }
    .queue-item.active { border-color: rgba(240,161,58,.24); background: var(--accent-soft); }
    .queue-top { display: flex; align-items: center; gap: 8px; font-size: 11px; }
    .queue-status { color: var(--accent); font-size: 9px; }
    .queue-cancel { margin-left: auto; border: 0; background: none; color: var(--faint); cursor: pointer; padding: 2px; }
    .queue-cancel:hover { color: var(--red); }
    .queue-item .progress { margin-top: 9px; }
    .queue-time { text-align: right; font-size: 9px; color: var(--muted); margin-top: 5px; }
    .empty { padding: 32px 15px; text-align: center; color: var(--faint); font-size: 11px; }
    .empty .icon { display: block; width: 28px; height: 28px; margin: 0 auto 10px; opacity: .55; }

    .module-card { overflow: hidden; position: relative; }
    .module-visual { height: 135px; display: grid; place-items: center; background: radial-gradient(circle, rgba(240,161,58,.12), transparent 62%), #11161a; border-bottom: 1px solid var(--line-soft); position: relative; }
    .module-visual:before, .module-visual:after { content: ""; position: absolute; border: 1px solid rgba(240,161,58,.16); border-radius: 50%; width: 100px; height: 100px; animation: spin 14s linear infinite; }
    .module-visual:after { width: 74px; height: 74px; border-style: dashed; animation-direction: reverse; animation-duration: 9s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .core { width: 42px; height: 42px; transform: rotate(45deg); background: var(--accent); box-shadow: 0 0 32px rgba(240,161,58,.28); position: relative; z-index: 2; }
    .core:after { content: ""; position: absolute; inset: 8px; border: 2px solid #18140e; }
    .module-level { position: absolute; top: 12px; right: 13px; font-size: 10px; color: var(--accent); letter-spacing: 1px; }
    .module-body { padding: 17px; }
    .module-effect { padding: 10px 12px; background: var(--green-soft); color: var(--green); border-radius: 7px; font-size: 11px; margin: 13px 0; }

    .tech-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .tech-card { padding: 19px; position: relative; }
    .tech-card.researched { border-color: rgba(85,199,160,.3); background: linear-gradient(140deg, rgba(85,199,160,.06), var(--panel)); }
    .tech-status { position: absolute; right: 16px; top: 16px; color: var(--faint); font-size: 9px; letter-spacing: 1px; }
    .tech-card.researched .tech-status { color: var(--green); }
    .tech-icon { color: var(--purple); margin-bottom: 13px; }
    .tech-icon .icon { width: 25px; height: 25px; }
    .tech-name { font-size: 14px; font-weight: 750; }
    .tech-desc { color: var(--muted); font-size: 11px; margin: 6px 0 13px; min-height: 33px; }
    .prereq { font-size: 9px; color: var(--faint); margin-bottom: 10px; }

    .quest-list { display: grid; gap: 10px; }
    .quest { display: grid; grid-template-columns: 42px minmax(0,1fr) 150px 100px; align-items: center; gap: 15px; padding: 15px 17px; }
    .quest-icon { width: 42px; height: 42px; border-radius: 9px; display: grid; place-items: center; background: var(--panel-3); color: var(--muted); }
    .quest.done .quest-icon { background: var(--green-soft); color: var(--green); }
    .quest.claimed { opacity: .55; }
    .quest-name { font-weight: 700; font-size: 12px; }
    .quest-desc { color: var(--muted); font-size: 10px; margin-top: 3px; }
    .quest-progress-meta { display: flex; justify-content: space-between; font-size: 9px; color: var(--muted); margin-bottom: 6px; }
    .quest-reward { font-size: 10px; color: var(--accent); margin-top: 5px; }

    .log-list { display: grid; gap: 0; max-height: 310px; overflow: auto; }
    .log-item { display: grid; grid-template-columns: 46px 1fr; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 10px; }
    .log-item:last-child { border-bottom: 0; }
    .log-time { color: var(--faint); }
    .log-text { color: var(--muted); }
    .tutorial { display: flex; align-items: center; gap: 13px; padding: 13px 16px; margin-bottom: 16px; border-color: rgba(103,169,216,.22); background: rgba(103,169,216,.06); }
    .tutorial .icon { color: var(--blue); }
    .tutorial-text { flex: 1; font-size: 11px; color: #a9bac5; }
    .tutorial strong { color: var(--text); }
    .tutorial-close { border: 0; background: none; color: var(--muted); cursor: pointer; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(3,6,8,.75); backdrop-filter: blur(7px); display: grid; place-items: center; padding: 20px; }
    .modal { width: min(480px, 100%); background: var(--panel-2); border: 1px solid #354049; border-radius: 14px; box-shadow: 0 28px 90px rgba(0,0,0,.5); overflow: hidden; animation: modal-in .18s ease-out; }
    @keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.98); } }
    .modal-head { padding: 19px 21px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 16px; font-weight: 750; }
    .modal-body { padding: 21px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .modal-body strong { color: var(--text); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 9px; padding: 0 21px 21px; }
    .help-steps { display: grid; gap: 13px; margin-top: 15px; }
    .help-step { display: grid; grid-template-columns: 26px 1fr; gap: 10px; }
    .step-num { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 11px; }
    .offline-gains { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
    .offline-gain { background: var(--panel-3); border-radius: 7px; padding: 10px; }
    .offline-gain strong { display: block; color: var(--green); }
    .toast-stack { position: fixed; right: 22px; bottom: 22px; z-index: 120; display: grid; gap: 8px; pointer-events: none; }

    function archiveTierInfo() {
      const count = state.claimedAchievements.length;
      const tiers = [
        { at: 0, name: "见习档案员", bonus: "尚无档案增益" },
        { at: 5, name: "工业记录者", bonus: "全厂产出 +5%" },
        { at: 10, name: "产业史学家", bonus: "发电能力 +10%" },
        { at: 20, name: "文明编纂者", bonus: "研究产出 +15%" },
        { at: 30, name: "工业记忆体", bonus: "全厂产出额外 +15%" }
      ];
      let current = tiers[0], next = tiers[1];
      for (let i = 0; i < tiers.length; i++) {
        if (count >= tiers[i].at) current = tiers[i];
        if (tiers[i].at > count) { next = tiers[i]; break; }
        next = null;
      }
      const bonuses = [];

      const craftButtons = '<button class="segment ' + (!state.auto.craft ? "active" : "") + '" data-action="auto-craft" data-id="">关闭</button>' + craftOptions.map(id => {
        const r = RECIPES[id], locked = r.tech && !hasTech(r.tech);
        return '<button class="segment ' + (state.auto.craft===id ? "active" : "") + '" data-action="auto-craft" data-id="' + id + '" ' + (locked ? "disabled" : "") + ' title="' + (locked ? "需科技：" + TECHS[r.tech].name : "目标库存 " + AUTO_TARGETS[id]) + '">' + r.name + '</button>';
      }).join("");
      return '<section class="panel" style="margin-top:14px"><div class="panel-head"><div class="panel-title">' + icon("toggle") + '自动化托管</div><div class="panel-tag">' + (unlocked ? "托管只处理重复操作" : "拥有 12 座建筑后解锁") + '</div></div><div class="panel-body">' +
        (unlocked ? '<div class="auto-layout"><div class="auto-status"><div class="auto-line"><span>电网自动补容</span><button class="btn small ' + (state.auto.power ? "primary" : "") + '" data-action="toggle-auto" data-id="power">' + icon("power") + (state.auto.power ? "托管中" : "已关闭") + '</button></div><div class="auto-line"><span>自动打造产线</span><strong>' + (state.auto.craft ? RECIPES[state.auto.craft].name : "未启用") + '</strong></div><div class="auto-line"><span>当前队列</span><strong class="mono">' + state.queue.length + ' / 8</strong></div><div class="muted" style="font-size:9px;line-height:1.7;margin-top:9px">自动补电仅在电网负载超过 90% 且现金保留充足时执行；自动打造会在队列低于 2 且库存未达目标时补单。</div></div><div><div class="panel-subheading">自动打造目标</div><div class="craft-select">' + craftButtons + '</div></div></div>' : '<div class="empty">' + icon("lock") + '托管系统尚未解锁<br>建造 12 座建筑或研究全自动流水线后启用</div>') + '</div></section>';
    }

    function renderHeadquarters() {
      const gain = prestigeGain(), requirement = prestigeRequirement(), canPrestige = score() >= requirement && gain > 0;
      const policyCards = Object.entries(POLICIES).map(([id,p]) => '<button class="policy-card ' + (state.policy===id?"active":"") + '" data-action="policy" data-id="' + id + '"><div class="policy-name">' + icon(p.icon) + p.name + (state.policy===id ? ' · 生效中' : '') + '</div><div class="policy-effect">' + p.desc + '</div></button>').join("");
      const legacyCards = Object.entries(LEGACY).map(([id,item]) => {
        const level = state.legacy[id], maxed = level >= item.max, cost = legacyCost(id, level);
        return '<div class="legacy-card"><div class="legacy-head"><span class="legacy-name">' + icon(item.icon) + ' ' + item.name + '</span><span class="legacy-level">LV.' + level + ' / ' + item.max + '</span></div><div class="legacy-desc">' + item.desc + '</div><button class="btn small ' + (!maxed && state.blueprints >= cost ? "primary" : "") + '" data-action="legacy" data-id="' + id + '" ' + (maxed || state.blueprints < cost ? "disabled" : "") + '>' + (maxed ? "已满级" : "升级 · " + cost + " BP") + '</button></div>';
      }).join("");
      return pageHead("GROUP HEADQUARTERS", "集团总部", "切换管理方针，用工业蓝图购买永久升级。产业重组会重置园区，但经验和蓝图会留下。", '<div class="panel-tag">重组 ' + state.stats.prestiges + ' 次</div>') +
        '<section class="panel hq-summary"><div><div class="blueprint-label">可用工业蓝图</div><div class="blueprint-number mono">' + fmt(state.blueprints) + ' <span style="font-size:11px;color:var(--muted)">BP</span></div><div class="blueprint-label" style="margin-top:7px">来自产业重组，永久保留</div></div><div class="building-icon" style="width:58px;height:58px;border-color:rgba(169,149,213,.3);background:rgba(169,149,213,.12);color:var(--purple)">' + icon("blueprint") + '</div></section>' +
        '<div class="hq-cols"><section class="panel"><div class="panel-head"><div class="panel-title">' + icon("policy") + '管理方针</div><div class="panel-tag">随时切换 · 只生效一项</div></div><div class="panel-body"><div class="policy-grid">' + policyCards + '</div></div></section>' +
          '<section class="prestige-card"><div class="contract-client">INDUSTRIAL RESTRUCTURING</div><h3>产业重组</h3><p>封存当前园区，保留蓝图、超级工程、工艺迭代、核心团队、工业档案与永久升级。重组只计算本轮园区指数，不会把永久工程重复变现。</p><div class="prestige-gain"><span>' + (canPrestige ? "本次可获得" : "重组门槛：工业指数 " + fmt(requirement)) + '</span><strong class="mono">' + (canPrestige ? "+" + gain + " BP" : fmt(score()) + " / " + fmt(requirement)) + '</strong></div><button class="btn primary full" data-action="prestige" ' + (!canPrestige ? "disabled" : "") + '>' + icon("reset") + (canPrestige ? "执行产业重组" : "尚未达到重组条件") + '</button></section></div>' +
        routePanelHTML() + automationPanelHTML() +
        '<section class="panel" style="margin-top:14px"><div class="panel-head"><div class="panel-title">' + icon("blueprint") + '永久升级</div><div class="panel-tag">工业蓝图不会被重组清空</div></div><div class="panel-body"><div class="legacy-grid">' + legacyCards + '</div></div></section>';
    }

    // 同页刷新只合并变化节点，保留 SVG 与 CSS 动画的连续播放。
    function morphNode(current, incoming) {
      if (current.nodeType !== incoming.nodeType || current.nodeName !== incoming.nodeName) {
        current.parentNode.replaceChild(document.importNode(incoming, true), current);
        return;
      }
      if (current.nodeType === 3 || current.nodeType === 8) {
        if (current.nodeValue !== incoming.nodeValue) current.nodeValue = incoming.nodeValue;
        return;
      }
      if (current.nodeType !== 1) return;
      for (let i = current.attributes.length - 1; i >= 0; i--) {
        const name = current.attributes[i].name;
        if (!incoming.hasAttribute(name)) current.removeAttribute(name);
      }
      for (let i = 0; i < incoming.attributes.length; i++) {
        const attr = incoming.attributes[i];
        if (current.getAttribute(attr.name) !== attr.value) current.setAttribute(attr.name, attr.value);
      }
      morphChildren(current, incoming);
    }
    function morphChildren(parent, incomingParent) {
      const currentChildren = Array.from(parent.childNodes);
      const newChildren = Array.from(incomingParent.childNodes);
      for (let i = 0; i < newChildren.length; i++) {
        if (!currentChildren[i]) parent.appendChild(document.importNode(newChildren[i], true));
        else morphNode(currentChildren[i], newChildren[i]);
      }
      for (let i = currentChildren.length - 1; i >= newChildren.length; i--) {
        if (parent.childNodes[i]) parent.removeChild(parent.childNodes[i]);
      }
    }
    function patchContent(container, html, tab) {
      const template = document.createElement("template");
      template.innerHTML = html;
      const signature = Array.from(template.content.children).map(el => el.tagName + "." + String(el.className) + "#" + (el.getAttribute("data-key") || "")).join("|");
      if (renderedTab !== tab || renderedSignature !== signature || !container.firstChild) {
        container.innerHTML = html;
        renderedTab = tab;
        renderedSignature = signature;
        return;
      }
      morphChildren(container, template.content);
    }

    function render() {
      const r = getRates(), rank = rankInfo();
      const powerPct = Math.round(r.efficiency * 100);
      const powerWarn = r.demand > r.capacity;
      document.getElementById("resources").innerHTML = ["cash","steel","circuits","research"].map(res => {
        const value = res === "cash" ? money(state[res]) : fmt(state[res]) + " " + RES[res].unit;
        const rate = r[res] > 0 ? '<span class="rate">+' + fmt(r[res]) + '/s</span>' : "";
        return '<div class="resource-chip">' + icon(RES[res].icon) + '<div><div class="resource-value mono">' + value + '</div><div class="resource-meta">' + RES[res].name + rate + '</div></div></div>';
      }).join("") + '<div class="resource-chip power ' + (powerWarn ? "warn" : "") + '" title="发电能力 ' + fmt(r.capacity) + ' MW / 全厂负载 ' + fmt(r.demand) + ' MW，供电效率 ' + powerPct + '%">' + icon("power") + '<div><div class="resource-value mono">' + powerPct + '%</div><div class="resource-meta"><span class="power-label">电力 </span><span class="rate">' + fmt(r.capacity) + '/' + fmt(r.demand) + ' MW</span></div></div></div>';
      const prev = rank.level === 1 ? 0 : [0,0,700,2200,5500,11000,24000,50000,100000,250000,600000][rank.level];
      const xp = rank.next === prev ? 100 : Math.min(100,(industrialIndex()-prev)/(rank.next-prev)*100);
      document.getElementById("site-card").innerHTML = '<div class="site-eyebrow">SITE 001 / ONLINE</div><div class="site-name">北辰工业园</div><div class="site-level"><span>' + rank.name + '</span><span class="mono">LV.' + rank.level + '</span></div><div class="xp-track"><div class="xp-fill" style="width:' + xp + '%"></div></div>';
      const claimable = QUESTS.filter(q => !state.claimed.includes(q.id) && q.value(state) >= q.target).length;
      document.getElementById("nav").innerHTML = NAV.map(([id,name,ic]) => '<button class="nav-btn ' + (state.tab===id?"active":"") + '" data-action="nav" data-id="' + id + '">' + icon(ic) + name + (id==="milestones" && claimable ? '<span class="nav-badge">' + claimable + '</span>' : "") + '</button>').join("");
      const views = { overview: renderOverview, buildings: renderBuildings, crafting: renderCrafting, synthesis: renderSynthesis, contracts: renderContracts, regions: renderRegions, projects: renderProjects, research: renderResearch, milestones: renderMilestones, archive: renderArchive, headquarters: renderHeadquarters, team: renderTeam };
      patchContent(document.getElementById("content"), (views[state.tab] || renderOverview)(), state.tab);
      lastRender = Date.now();
    }

    function openModal(title, body, actions = "") {
      document.getElementById("modal-root").innerHTML = '<div class="modal-backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" aria-label="' + title + '"><div class="modal-head"><div class="modal-title">' + title + '</div><button class="icon-btn" data-action="close-modal" aria-label="关闭">' + icon("close") + '</button></div><div class="modal-body">' + body + '</div>' + (actions ? '<div class="modal-actions">' + actions + '</div>' : "") + '</div></div>';
    }
    function closeModal() { document.getElementById("modal-root").innerHTML = ""; }
    function showHelp() {
      openModal("厂长经营手册", '<strong>目标：</strong>从回收废钢起步，建立涵盖能源、冶金、电子、量子与轨道制造的现代工业体系。<div class="help-steps"><div class="help-step"><span class="step-num">1</span><div><strong>先电力，后产能</strong><br>所有耗电建筑共享电网。供电不足时，全厂效率会按供电比例下降；储能与循环经济科技能压低需求。</div></div><div class="help-step"><span class="step-num">2</span><div><strong>打通多层产业链</strong><br>钢铝 → 电路与硅料 → 电池与部件 → 芯片、机器人、量子单元。高级配方需要先研究对应科技。</div></div><div class="help-step"><span class="step-num">3</span><div><strong>处理调度事件</strong><br>总览页会不定期出现园区事件。短期增益和即时资源都要付代价，没有“全都要”的选项。</div></div><div class="help-step"><span class="step-num">4</span><div><strong>把园区铺向全球</strong><br>「布局」页一次性投资区域基地，永久增强电力、研究、合约或建造成本。区域越多，协同越强。</div></div><div class="help-step"><span class="step-num">5</span><div><strong>托管与产业纲领</strong><br>拥有 12 座建筑后可启用自动补电和自动打造；研究全自动流水线后，还可在总部选择互斥产业纲领，解锁专属建筑。</div></div><div class="help-step"><span class="step-num">6</span><div><strong>把目光放到小时级工程</strong><br>「工程」页的超级工程会持续 45 分钟到 12 小时，离线也计时。完工后永久增强产能并解锁稀土与超导产业链。</div></div><div class="help-step"><span class="step-num">7</span><div><strong>组建核心团队</strong><br>「团队」页招募 8 名工业专家，但只有 3 个核心席位。专家加成覆盖产能、能源、研究、合约与边疆资源，团队跨重组保留。</div></div><div class="help-step"><span class="step-num">8</span><div><strong>档案、迭代与离线</strong><br>「档案」页的工业成就会提升永久档案等级；科技页底部的工艺迭代也是长期研究。产业重组保留档案、工程、迭代与团队，只重置本轮园区。离线按 50% 效率结算，最多 8 小时。</div></div></div>', '<button class="btn primary" data-action="close-modal">开始经营</button>');
    }

    // 交互期间冻结后台重绘：避免按压中的按钮被 innerHTML 替换，导致 click 丢失。
    document.addEventListener("pointerdown", () => { pointerHeld = true; pointerDownAt = Date.now(); }, true);
    const releasePointer = () => {
      pointerHeld = false;
      interactionUntil = Date.now() + 220;
    };
    document.addEventListener("pointerup", releasePointer, true);
    document.addEventListener("pointercancel", releasePointer, true);
    window.addEventListener("blur", releasePointer);
    document.addEventListener("keydown", () => { interactionUntil = Date.now() + 350; }, true);

    document.addEventListener("click", e => {
      const el = e.target.closest("[data-action]");
      if (!el) return;
      const action = el.dataset.action, id = el.dataset.id;
      if (action === "close-modal" && e.target.closest(".modal") && !e.target.closest("button")) return;
      const actions = {
        nav: () => { state.tab = id; render(); window.scrollTo({ top: 0, behavior: "smooth" }); },
        "buy-mode": () => { state.buyMode = id; render(); },
        buy: () => buyBuilding(id), craft: () => queueCraft(id), "cancel-craft": () => cancelCraft(id),
        synth: () => synthesize(id), research: () => researchTech(id), claim: () => claimQuest(id),
        "complete-contract": () => completeContract(id), "refresh-contracts": refreshContracts,
        "invest-region": () => investRegion(id), "event-choice": () => resolveEvent(Number(id)),
        "dismiss-event": dismissEvent, "toggle-auto": () => toggleAuto(id), "auto-craft": () => setAutoCraft(id || ""),
        "start-project": () => startProject(id), "buy-iteration": () => buyIteration(id),
        "route-choose": () => pickRoute(id), "confirm-route": () => commitRoute(id),
        "hire-staff": () => hireStaff(id), "toggle-staff": () => toggleStaff(id),
        "claim-achievement": () => claimAchievement(id),
        policy: () => setPolicy(id), legacy: () => buyLegacy(id),
        prestige: () => {
          const gain = prestigeGain();
          openModal("产业重组确认", "本次重组将<strong>清空建筑、资源、科技、打造队列与合成核心</strong>，但保留全部工业蓝图、永久升级、超级工程、工艺迭代、核心团队与工业档案。产业纲领与本轮科技将重置。预计获得 <strong>" + gain + " BP</strong>。<br><br>本轮工业指数：" + fmt(score()) + "，重组后将从一座光伏电站重新起步。", '<button class="btn" data-action="close-modal">暂不重组</button><button class="btn primary" data-action="confirm-prestige">确认产业重组</button>');
        },
        "confirm-prestige": () => { closeModal(); doPrestige(); },
        sell: () => sellSteel(false), "sell-all": () => sellSteel(true), save: () => saveGame(true),
        help: showHelp, "close-modal": closeModal,
        "dismiss-tutorial": () => { state.tutorial = false; render(); },
        reset: () => openModal("重新开局", "这会清除当前工业园的全部建筑、资源、科技、核心、蓝图与永久升级，<strong>且无法撤销</strong>。如果只想重新经营一轮，请使用总部的「产业重组」。", '<button class="btn" data-action="close-modal">保留存档</button><button class="btn primary" data-action="confirm-reset">确认清空存档</button>'),
        "confirm-reset": () => { localStorage.removeItem(SAVE_KEY); state = newState(); ensureContracts(true); closeModal(); addLog("新的工业园已经奠基。"); render(); toast("新周目已开始", true); }
      };
      if (actions[action]) actions[action]();
    });

    document.getElementById("brand-icon").innerHTML = icon("factory");
    document.getElementById("help-btn").innerHTML = icon("help");
    document.getElementById("save-btn").innerHTML = icon("save");
    document.getElementById("reset-btn").innerHTML = icon("reset");

    function applyOffline() {
      const elapsed = Math.max(0,(Date.now() - Number(state.lastSave || Date.now()))/1000);
      if (elapsed < 120) return;
      const seconds = Math.min(elapsed, 8*3600), effective = seconds * .5, r = getRates(), gains = {};
      PRODUCTION_KEYS.forEach(res => {
        gains[res] = (r[res] || 0) * effective; state[res] += gains[res];
        recordProduction(res, gains[res]);
      });
      processCraft(effective * craftSpeed(), false);
      offlineReport = { elapsed: seconds, gains };
      addLog("离线生产报告已生成，离岗期间按 50% 效率结算。");
    }
    function showOffline() {
      if (!offlineReport) return;
      const gains = Object.entries(offlineReport.gains).filter(([,v]) => v > .01);
      openModal("欢迎回来，厂长", '离开 <strong>' + timeText(offlineReport.elapsed) + '</strong>，园区以 50% 效率持续运行（单次最多结算 8 小时）。<div class="offline-gains">' + gains.map(([r,v]) => '<div class="offline-gain"><span>' + RES[r].name + '</span><strong class="mono">+' + fmt(v) + ' ' + RES[r].unit + '</strong></div>').join("") + '</div>', '<button class="btn primary" data-action="close-modal">接收生产报告</button>');
      offlineReport = null;
    }

    function tick() {
      const now = Date.now(), dt = Math.min(Math.max(0,(now-lastTick)/1000), 8*3600);
      lastTick = now;
      if (dt > 0) {
        const r = getRates();
        PRODUCTION_KEYS.forEach(res => {
          const amount = (r[res] || 0) * dt; state[res] += amount;
          recordProduction(res, amount);
        });
        processCraft(dt * craftSpeed());
        state.stats.playtime += dt;
        Object.keys(state.buffs).forEach(type => { if (!state.buffs[type] || state.buffs[type].expires <= now) delete state.buffs[type]; });
        checkProjects();
        runAutomation();
      }
      if (pointerHeld && now - pointerDownAt > 15000) releasePointer();
      if (!pointerHeld && now >= interactionUntil && now - lastRender > 500) render();
      if (now - lastSave > 10000) { saveGame(); lastSave = now; }
    }

    applyOffline();
    ensureContracts();
    ensureEvent();
    render();
    showOffline();
    setInterval(tick, 250);
    window.addEventListener("beforeunload", () => saveGame());
    document.addEventListener("visibilitychange", () => { if (document.hidden) saveGame(); });

    window.IndustrialGame = { getRates, buildingCost, moduleCost, craftSpeed, newState, QUESTS, BUILDINGS, RECIPES, MODULES, TECHS, POLICIES, LEGACY, prestigeGain };
  </script>
</body>
</html>
